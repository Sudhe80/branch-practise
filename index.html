<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Recruitment Agent</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #8b0000, #ff0000);
        }

        .login-container {
            width: 400px;
            padding: 40px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #d60000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 30px;
            font-weight: bold;
        }

        .logo h1 {
            color: #b30000;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #d60000;
            box-shadow: 0 0 0 3px rgba(214, 0, 0, 0.1);
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            font-size: 14px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #555;
        }

        .remember input {
            accent-color: #d60000;
        }

        .forgot {
            color: #d60000;
            text-decoration: none;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #b30000, #ed0000);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: linear-gradient(90deg, #8b0000, #c00000);
            transform: translateY(-1px);
        }

        .register {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 14px;
        }

        .register a {
            color: #d60000;
            font-weight: bold;
            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }

        .error-message {
            display: none;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 7px;
            background: #ffe5e5;
            color: #b30000;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">

            <div class="icon">
                RA
            </div>

            <h1>Recruitment Agent</h1>

            <p>AI-Powered Recruitment System</p>

        </div>

        <div class="error-message" id="errorMessage">
            Invalid email or password.
        </div>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <div class="options">

                <label class="remember">
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#" class="forgot">
                    Forgot Password?
                </a>

            </div>

            <button type="submit" class="login-btn">
                LOGIN
            </button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="/register">Create Account</a>
        </div>

    </div>

    <script>
        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                const errorMessage =
                    document.getElementById("errorMessage");

                try {

                    const response = await fetch("/api/login", {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {

                        window.location.href = "/dashboard";

                    } else {

                        errorMessage.textContent =
                            data.detail ||
                            "Invalid email or password.";

                        errorMessage.style.display = "block";
                    }

                } catch (error) {

                    errorMessage.textContent =
                        "Unable to connect to the server.";

                    errorMessage.style.display = "block";
                }

            });
    </script>

</body>
</html>
